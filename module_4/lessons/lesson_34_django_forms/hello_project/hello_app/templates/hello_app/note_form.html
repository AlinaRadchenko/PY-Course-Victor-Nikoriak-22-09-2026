{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{{ heading }}</h1>
<form method="post" class="card card-body" novalidate>
  {% csrf_token %}
  {{ form|crispy }}
  <div><button type="submit" class="btn btn-primary">Зберегти</button></div>
</form>
{% endblock %}
